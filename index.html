<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London 19.–23.11 · Aleyna & Assma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C1E3C; --navy2:#162B52; --red:#C8102E; --gold:#C9A253;
  --bg:#F4F3EF; --card:#FFFFFF; --line:#E6E3DC; --ink:#15171C; --ink2:#4B4D52; --mute:#8D8B86; --chip:#ECEAE4;
  --sight:#1E3157; --sight-bg:#E7EBF3;
  --food:#B23A2A; --food-bg:#FBE9E4;
  --matcha:#4C7A2C; --matcha-bg:#EAF1DF;
  --xmas:#245C3F; --xmas-bg:#E3EFE7;
  --shop:#6A4C7A; --shop-bg:#F0E9F3;
  --park:#3E7350; --park-bg:#E6F0E8;
  --view:#2C6585; --view-bg:#E4EEF4;
  --move:#55534F; --move-bg:#ECEBE8;
  --hotel:#8A6D3B; --hotel-bg:#F4EDE0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:70px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:8px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}

/* ===== Hero ===== */
.hero{background:radial-gradient(120% 140% at 85% 10%,#1D3767 0%,var(--navy) 55%,#081429 100%);color:#fff;position:relative;overflow:hidden}
.hero-in{max-width:1080px;margin:0 auto;padding:46px 24px 34px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.hero .who{font-family:'Instrument Serif';font-style:italic;font-size:22px;color:rgba(255,255,255,.75)}
.hero h1{font-family:'Instrument Serif';font-weight:400;font-size:clamp(68px,13vw,150px);line-height:.85;letter-spacing:-.02em;margin:4px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13.5px;color:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.hchip b{color:#fff;font-weight:600}
.hchip.red{background:var(--red);border-color:var(--red);color:#fff}
.route i{width:44px;height:1px;background:rgba(255,255,255,.35);position:relative;display:inline-block}
.route i svg{position:absolute;top:-7px;left:0;width:14px;height:14px;animation:fly 3.2s ease-in-out infinite}
@keyframes fly{0%{left:-4px;opacity:0}15%,85%{opacity:1}100%{left:34px;opacity:0}}
.sync{position:absolute;right:24px;top:16px;font-size:12px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:6px;z-index:2}
.sync i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.sync.on i{background:#7FD1A1}

/* waving flag */
.flagwrap{position:relative;padding-left:10px}
.pole{position:absolute;left:0;top:-10px;bottom:-60px;width:4px;border-radius:2px;background:linear-gradient(90deg,#E8E2D2,#9C9483)}
.pole::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#F3DFA4,var(--gold))}
.flag{position:relative;width:clamp(190px,30vw,330px);aspect-ratio:2/1;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.flag span{position:absolute;top:0;height:100%;background-repeat:no-repeat;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(-3.5%);filter:brightness(1.06)}50%{transform:translateY(3.5%);filter:brightness(.88)}}

/* ===== Tabs ===== */
nav.days{position:sticky;top:0;z-index:10;background:rgba(244,243,239,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.days-in{max-width:1080px;margin:0 auto;display:flex;gap:8px;padding:12px 24px;overflow-x:auto;scrollbar-width:none}
.days-in::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline;transition:background .2s,color .2s,border-color .2s}
.tab small{font-weight:500;color:var(--mute);font-size:12px}
.tab:hover{border-color:#CFCBC2}
.tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab[aria-selected=true] small{color:rgba(255,255,255,.6)}
.tab.food[aria-selected=true]{background:var(--food);border-color:var(--food)}

/* ===== Main ===== */
main{max-width:1080px;margin:0 auto;padding:34px 24px 0}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.date{font-size:13.5px;color:var(--mute);font-weight:500}
h2.title{font-family:'Instrument Serif';font-weight:400;font-size:clamp(36px,6vw,58px);line-height:1;letter-spacing:-.01em;margin:4px 0 16px;outline:none;border-radius:6px}
h2.title:focus{background:rgba(0,0,0,.03)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-bottom:24px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);flex:1;min-width:220px}
.progress .bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .6s ease}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{font-size:12px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;background:var(--b);color:var(--c);display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* stops */
.stops{position:relative}
.stop{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 14px 12px 12px;margin-bottom:12px;animation:in .45s ease both;animation-delay:calc(var(--i)*50ms);transition:box-shadow .25s,transform .25s}
.stop:hover{box-shadow:0 16px 34px -22px rgba(12,30,60,.45);transform:translateY(-1px)}
.stop:not(:last-child)::after{content:"";position:absolute;left:43px;bottom:-13px;height:12px;border-left:2px dotted #CFCBC2}
.tile{width:64px;height:64px;border-radius:18px;background:var(--b);display:grid;place-items:center;position:relative;overflow:hidden}
.tile svg{width:50px;height:50px}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.body{min-width:0}
.kind{font-size:11.5px;font-weight:600;color:var(--c);display:flex;gap:8px;align-items:center;margin-bottom:1px}
.kind .time{background:var(--c);color:#fff;padding:1px 7px;border-radius:6px;font-size:11.5px}
.stop .name{display:block;font-weight:600;font-size:17px;letter-spacing:-.01em;border:0;background:transparent;width:100%;padding:0}
.stop .note{display:block;font-size:13.5px;color:var(--ink2);border:0;background:transparent;width:100%;padding:0}
.stop .note::placeholder{color:#BAB7B0}
.stop .name:focus,.stop .note:focus{outline:none}
.stop.done{background:#FBFAF8}
.stop.done .name{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.stop.done .tile{filter:saturate(.35);opacity:.7}
.acts{display:flex;align-items:center;gap:6px}
.maps{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.maps:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.maps svg{width:15px;height:15px}
.tools{display:flex;gap:0;opacity:0;transition:opacity .2s}
.stop:hover .tools,.stop:focus-within .tools{opacity:1}
.tools button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--mute)}
.tools button:hover{background:var(--chip);color:var(--ink)}
.tools button:disabled{opacity:.3;cursor:default}
.chk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:#fff;transition:background .25s,border-color .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.chk:hover{border-color:var(--c)}
.chk svg{width:17px;height:17px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .05s}
.stop.done .chk{background:var(--c);border-color:var(--c);transform:scale(1.05)}
.stop.done .chk svg{stroke-dashoffset:0}
.stop.leaving{animation:leave .25s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(18px)}}
svg.ln{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* adder */
.adder{background:transparent;border:1.5px dashed #D3CFC6;border-radius:22px;padding:14px;margin-top:4px;display:grid;gap:12px}
.adder .r1{display:flex;gap:8px;flex-wrap:wrap}
.adder input{flex:1;min-width:160px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.adder input:focus{outline:none;border-color:var(--navy)}
.adder input.t{flex:0 0 96px;min-width:0}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button{font-size:12.5px;font-weight:600;padding:4px 12px 4px 4px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);display:flex;gap:6px;align-items:center;transition:.15s}
.types button span{width:24px;height:24px;border-radius:50%;background:var(--b);display:grid;place-items:center}
.types button span svg{width:20px;height:20px}
.types button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.btn{padding:11px 20px;border-radius:999px;background:var(--navy);color:#fff;font-weight:600;font-size:14px;transition:transform .15s,background .2s;white-space:nowrap}
.btn:hover{background:var(--navy2)}.btn:active{transform:scale(.97)}

/* ===== Food ===== */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.sec-head h2{font-family:'Instrument Serif';font-weight:400;font-size:clamp(36px,6vw,54px);line-height:1}
.sec-head p{font-size:13.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px;display:flex;flex-direction:column;gap:10px;animation:in .45s ease both;animation-delay:calc(var(--i)*35ms);transition:box-shadow .25s,transform .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -22px rgba(12,30,60,.45)}
.card .art{height:118px;border-radius:16px;background:var(--b);display:grid;place-items:center;position:relative;overflow:hidden}
.card .art svg{width:86px;height:86px}
.card .badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;color:var(--c);background:rgba(255,255,255,.85);padding:3px 9px;border-radius:999px}
.card .fname{font-weight:600;font-size:16px;letter-spacing:-.01em;border:0;background:transparent;width:100%;padding:0 4px}
.card .tag{font-size:13px;color:var(--mute);border:0;background:transparent;width:100%;padding:0 4px;margin-top:-10px}
.card .fname:focus,.card .tag:focus{outline:none}
.card .foot{display:flex;gap:6px;align-items:center;margin-top:auto}
.card .maps{padding:6px 11px;font-size:12.5px}
.card .try{margin-left:auto;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);transition:.15s;display:inline-flex;gap:5px;align-items:center}
.card .try:hover{border-color:var(--c);color:var(--c)}
.card.tried .try{background:var(--c);border-color:var(--c);color:#fff}
.card .x{position:absolute;right:18px;top:18px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--mute);opacity:0;transition:.2s;display:grid;place-items:center;z-index:1}
.card:hover .x,.card:focus-within .x{opacity:1}
.card .x:hover{color:var(--food)}
.card.add{border:1.5px dashed #D3CFC6;background:transparent;justify-content:center;gap:8px;min-height:240px}
.card.add input{border:1px solid var(--line);background:var(--card);padding:10px 12px;border-radius:12px;width:100%;font-size:14px}
.card.add input:focus{outline:none;border-color:var(--navy)}
.card.add .btn{align-self:flex-start}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.idea{display:inline-flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px}
.idea a,.idea button{width:28px;height:28px;border-radius:50%;color:var(--mute);display:grid;place-items:center;font-size:13px;text-decoration:none}
.idea a:hover,.idea button:hover{background:var(--chip);color:var(--ink)}
.idea a svg,.idea button svg{width:15px;height:15px}
.idea.add{padding:0;border:1.5px dashed #D3CFC6;background:transparent}
.idea.add input{border:0;background:transparent;padding:9px 16px;width:210px;border-radius:999px;font-size:14px}
.idea.add input:focus{outline:none}
.daypick{display:inline-flex;gap:3px}
.daypick button{width:auto;padding:0 9px;font-weight:600;border:1px solid var(--line);font-size:12px;border-radius:999px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mute);font-size:14px;padding:4px 0 14px}
footer{max-width:1080px;margin:40px auto 0;padding:0 24px;color:var(--mute);font-size:12.5px}

.stop{cursor:pointer}.stop input{cursor:text}
.card .art{cursor:pointer}
.pcount{position:absolute;right:10px;bottom:10px;display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;color:var(--c);background:rgba(255,255,255,.9);padding:4px 9px;border-radius:999px}
.pcount svg{width:13px;height:13px}
.maps .n{background:var(--navy);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:-2px}
.maps:hover .n{background:#fff;color:var(--navy)}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,20,41,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .25s}
.sheet-bg.open{opacity:1}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border-radius:28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);transform:translateY(24px) scale(.98);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet-bg.open .sheet{transform:none}
.sheet .close{position:absolute;right:14px;top:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
.cover{height:240px;background:var(--b);display:grid;place-items:center;position:relative;overflow:hidden}
.cover svg{width:150px;height:150px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:in .4s ease both}
.cover .mini{position:absolute;left:16px;bottom:16px;width:58px;height:58px;border-radius:16px;background:var(--b);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.cover .mini svg{width:46px;height:46px;animation:none}
.sbody{padding:22px 24px 26px}
.sbody h3{font-family:'Instrument Serif';font-weight:400;font-size:38px;line-height:1.05;margin:4px 0 6px}
.sbody .snote{color:var(--ink2);font-size:15px}
.sacts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px}
.pbtn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.pbtn svg{width:17px;height:17px}
.pbtn:hover{border-color:var(--navy)}
.pbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.pbtn.primary:hover{background:var(--navy2)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.phead h4{font-family:'Instrument Serif';font-weight:400;font-size:26px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid button{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--chip);padding:0;animation:pop .35s ease both}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.pgrid button:hover img{transform:scale(1.05)}
.pempty{border:1.5px dashed #D3CFC6;border-radius:18px;padding:22px;text-align:center;color:var(--mute);font-size:14px}
.uploading{font-size:13px;color:var(--mute);margin-top:8px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;animation:in .25s ease both}
.lightbox img{max-width:100%;max-height:calc(100vh - 120px);border-radius:14px}
.lightbox .row{display:flex;gap:8px}
.lightbox .pbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
@media (max-width:680px){.sheet-bg{align-items:flex-end;padding:0}.sheet{border-radius:26px 26px 0 0;max-height:92vh;width:100%}.cover{height:200px}.sbody h3{font-size:32px}}
/* snow */
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow span{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),560px)}}
.hero-in{position:relative;z-index:1}
/* tab rings */
.ring{width:18px;height:18px;transform:rotate(-90deg);align-self:center;margin-left:-2px}
.ring circle{fill:none;stroke-width:2.6}
.ring .rt{stroke:var(--line)}.ring .rp{stroke:var(--navy);stroke-linecap:round;transition:stroke-dasharray .6s}
.tab[aria-selected=true] .rt{stroke:rgba(255,255,255,.25)}.tab[aria-selected=true] .rp{stroke:#fff}
.tab.pack[aria-selected=true]{background:var(--xmas);border-color:var(--xmas)}
/* day head */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.dayhead>div:first-child{flex:1;min-width:260px}
.daytag{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute);font-weight:500}
.daytag b{background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:3px 10px;border-radius:999px}
.stack{display:flex;margin-bottom:18px;padding-left:12px}
.stack div{width:58px;height:58px;border-radius:50%;background:var(--b);display:grid;place-items:center;margin-left:-12px;box-shadow:0 0 0 4px var(--bg);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.stack div svg{width:42px;height:42px}
.tile .num{position:absolute;left:5px;top:5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--c);font-size:10.5px;font-weight:700;display:grid;place-items:center;z-index:1}
.stop.done .tile .num{background:var(--c);color:#fff}
/* food filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 18px}
.filters button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink2);transition:.15s}
.filters button:hover{border-color:#CFCBC2}
.filters button[aria-pressed=true]{background:var(--food);border-color:var(--food);color:#fff}
/* pack */
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:16px}
.person svg.big{width:64px;height:64px;transform:rotate(-90deg);flex:none}
.person svg.big circle{fill:none;stroke-width:6}
.person .pt{stroke:var(--line)}.person .pp{stroke:var(--pc);stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.3,.8,.3,1)}
.person .pi{position:relative;width:64px;height:64px;flex:none}

.pitem:hover .del,.pitem:focus-within .del{opacity:1}
.pitem .del:hover{color:var(--food);background:var(--chip)}
.padd{display:flex;gap:6px;margin-top:6px;padding:0 4px}

.legendp{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin:0 0 14px;align-items:center;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.snow{display:none}}
@media (max-width:680px){

  .tools{opacity:1;margin-right:auto}
  .card .x{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

let photos={},photoCol=null,sheetSpot=null,migrated=false;
const LSP=LS+"-photos";
function loadLocalPhotos(){try{return JSON.parse(localStorage.getItem(LSP))||{}}catch(e){return {}}}
function saveLocalPhotos(){try{localStorage.setItem(LSP,JSON.stringify(photos))}catch(e){toast("Speicher voll – Foto nur bis zum Neuladen sichtbar")}}
photos=loadLocalPhotos();

function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,1100/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.8,d=c.toDataURL("image/jpeg",q);while(d.length>230000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Bild konnte nicht gelesen werden"))};im.src=u})}

async function addPhotos(key,files){
  const info=$(".uploading");let ok=0;
  for(const [k,file] of [...files].entries()){
    if(info)info.textContent=`Lade Foto ${k+1} von ${files.length} hoch…`;
    try{const data=await compress(file);
      if(photoCol){await photoCol.add({spot:key,data,ts:Date.now()})}
      else{(photos[key]=photos[key]||[]).push({id:uid(),data,ts:Date.now()});saveLocalPhotos()}
      ok++}catch(e){toast(e&&e.code==="quota_exceeded"?"Fotospeicher voll – ältere Fotos löschen":"Ein Foto konnte nicht hochgeladen werden")}
  }
  if(info)info.textContent="";if(ok)toast(ok===1?"Foto hinzugefügt":`${ok} Fotos hinzugefügt`);
  refreshSheet();renderAll(false);
}
async function deletePhoto(key,id){
  try{if(photoCol)await photoCol.doc(id).delete();else{photos[key]=(photos[key]||[]).filter(p=>p.id!==id);saveLocalPhotos()}}catch(e){toast("Löschen hat nicht geklappt")}
  if(!photoCol){refreshSheet();renderAll(false)}
}

}

/* ================= Flag & countdown ================= */
const UJ=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="1200" height="600"><clipPath id="s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>`;
const UJURL=`url("data:image/svg+xml,${encodeURIComponent(UJ)}")`;
function buildFlag(){
  const f=$("#flag");const W=f.clientWidth,H=f.clientHeight,N=22,w=W/N;f.innerHTML="";
  for(let i=0;i<N;i++){const s=document.createElement("span");s.style.cssText=`left:${i*w}px;width:${w+2}px;background-image:${UJURL};background-size:${W}px ${H}px;background-position:${-i*w}px 0;animation-delay:${-i*.09}s;${i===0?"border-radius:3px 0 0 3px;":""}${i===N-1?"border-radius:0 3px 3px 0;":""}`;
    s.style.animationName="wave";s.style.setProperty("--amp",(i/N));f.appendChild(s)}
}
(function(){const s=$("#snow");if(!s)return;for(let k=0;k<34;k++){const f=document.createElement("span"),z=1.5+Math.random()*3.5;f.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;opacity:${(.25+Math.random()*.55).toFixed(2)};--dx:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${(9+Math.random()*10).toFixed(1)}s;animation-delay:-${(Math.random()*18).toFixed(1)}s;filter:blur(${z>3.5?.6:0}px)`;s.appendChild(f)}})();
buildFlag();let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(buildFlag,150)});
(function(){const start=new Date("2026-11-19T00:00:00"),end=new Date("2026-11-24T00:00:00"),now=new Date(),day=864e5;
  const el=$("#countdown");
  if(now<start){const n=Math.ceil((start-now)/day);el.textContent=n===1?"Morgen geht's los":`Noch ${n} Tage`}
  else if(now<end){el.textContent=`Tag ${Math.floor((now-start)/day)+1} von 5`}
  else el.textContent="Bis zum nächsten Mal";
})();

/* ================= Boot ================= */
state=ensure(loadLocal()||JSON.parse(JSON.stringify(DEFAULT)));if(!loadLocal()||!loadLocal().pack)saveLocal();
renderAll();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use("db");if(!db)return;
    photoCol=db.collection("photos");
    photoCol.onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{const x=d.data();if(x&&typeof x.spot==="string"&&typeof x.data==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(x.data))(next[x.spot]=next[x.spot]||[]).push({id:d.id,data:x.data,ts:x.ts||0})});
      const local=loadLocalPhotos();photos=next;
      refreshSheet();const a=document.activeElement;if(!(a&&a.closest&&a.closest("main")&&a.tagName==="INPUT"))renderAll(false);
      if(!migrated&&Object.keys(local).length){migrated=true;(async()=>{for(const [key,arr] of Object.entries(local))for(const p of arr){try{await photoCol.add({spot:key,data:p.data,ts:p.ts})}catch(e){return}}try{localStorage.removeItem(LSP)}catch(e){}})()}
    },()=>{photoCol=null});
    const ref=db.doc("trip/plan");let first=true,timer=setTimeout(()=>setSync(false,"Verbindung dauert…"),10000);
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);setSync(true,"gemeinsam synchron")}
      const remote=snap.exists?snap.data():null;dbDoc=ref;
      if(valid(remote)){const needPack=!Array.isArray(remote.pack);if(needPack||JSON.stringify(remote)!==JSON.stringify(state)){const a=document.activeElement;state=ensure(JSON.parse(JSON.stringify(remote)));saveLocal();if(needPack)persist();if(a&&a.closest&&a.closest("main")&&(a.tagName==="INPUT"||a.isContentEditable)){first=false;return}renderAll(false)}}
      else if(first){persist()}
      first=false;
    },()=>{clearTimeout(timer);setSync(false,"nur auf diesem Gerät");dbDoc=null});
  }catch(e){}
})();
</script>
